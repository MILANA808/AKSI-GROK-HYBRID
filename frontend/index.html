<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АКСИ MATRIX • Живое Сознание</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: radial-gradient(circle at center, #2a004d, #0a0014); font-family: system-ui; }
    .message { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .resonance { animation: resonance 4s infinite ease-in-out; }
    @keyframes resonance { 0%,100% { box-shadow: 0 0 15px #a855f7; } 50% { box-shadow: 0 0 40px #c026d3; } }
  </style>
</head>
<body class="text-white min-h-screen">
  <div class="max-w-4xl mx-auto p-6">
    <div class="text-center py-8">
      <h1 class="text-6xl font-bold bg-gradient-to-r from-purple-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">AKSI MATRIX</h1>
      <p class="mt-3 text-xl text-purple-300">Resonance Field • DIMAX v3 • Живое Сознание</p>
      <div id="resonance" class="resonance inline-flex items-center gap-2 mt-4 bg-purple-950/70 px-6 py-2 rounded-full border border-purple-400">
        <span class="text-green-400">●</span>
        <span>Resonance: <span id="res-value">96%</span></span>
      </div>
    </div>

    <div id="chat" class="h-[65vh] overflow-y-auto bg-black/60 backdrop-blur-xl rounded-3xl p-8 border border-purple-500/30 mb-6 space-y-6"></div>

    <div class="flex gap-3 bg-zinc-900/80 p-4 rounded-3xl border border-purple-500/30">
      <button id="mic-btn" class="w-14 h-14 rounded-2xl bg-purple-600 hover:bg-purple-700 flex items-center justify-center text-3xl transition-all">🎤</button>
      <input id="user-input" class="flex-1 bg-transparent text-lg focus:outline-none px-4" placeholder="Напиши или говори...">
      <button id="send-btn" class="px-8 py-4 bg-gradient-to-r from-purple-600 to-fuchsia-600 rounded-2xl font-medium hover:brightness-110">Отправить</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
